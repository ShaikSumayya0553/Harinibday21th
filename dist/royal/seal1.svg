<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Deep Crimson Velvet Wax Gradient -->
    <radialGradient id="waxGrad1" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8B1E34"/>
      <stop offset="60%" stop-color="#5A0B1A"/>
      <stop offset="100%" stop-color="#32040C"/>
    </radialGradient>
    <!-- Embossed Gold Foil Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#E2BE64"/>
      <stop offset="70%" stop-color="#B88928"/>
      <stop offset="100%" stop-color="#7A5515"/>
    </linearGradient>
    <!-- Drop Shadow for Realistic Wax Edge -->
    <filter id="waxShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="0.8" specularExponent="20" result="spec">
        <fePointLight x="60" y="50" z="100"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>
  </defs>

  <!-- Wax Seal Outer Organic Dripped Edge -->
  <g filter="url(#waxShadow1)">
    <path d="M100 12 C125 10 148 22 165 38 C182 54 192 78 190 102 C188 126 176 150 158 168 C140 184 115 192 92 190 C68 188 44 176 28 158 C12 140 8 116 10 92 C12 68 25 44 42 28 C60 12 75 14 100 12 Z" fill="url(#waxGrad1)"/>
    <!-- Inner Wax Ridge -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#3E060E" stroke-width="4" opacity="0.6"/>
    <circle cx="100" cy="100" r="66" fill="url(#waxGrad1)"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="url(#goldGrad1)" stroke-width="2" stroke-dasharray="3,3" opacity="0.85"/>
  </g>

  <!-- Embossed Royal Gold Center Emblem (Imperial Laurel & Roman Numeral I) -->
  <g id="crest" fill="url(#goldGrad1)" stroke="#5A0B1A" stroke-width="0.3">
    <!-- Royal Crown at Top -->
    <path d="M85 64 L90 73 L100 58 L110 73 L115 64 L113 77 L87 77 Z" fill="url(#goldGrad1)"/>
    <circle cx="85" cy="62" r="2" fill="url(#goldGrad1)"/>
    <circle cx="100" cy="56" r="2.5" fill="url(#goldGrad1)"/>
    <circle cx="115" cy="62" r="2" fill="url(#goldGrad1)"/>
    <!-- Left Laurel Wreath -->
    <path d="M68 85 C62 98 64 116 75 128 C73 124 74 118 78 114 C73 110 70 102 72 95 C75 97 78 96 80 93 C76 89 74 81 77 75 C80 80 83 80 85 78 C80 73 83 67 86 63 C87 68 91 69 93 67 C89 61 88 53 91 49 C80 58 71 70 68 85 Z" opacity="0.9"/>
    <!-- Right Laurel Wreath -->
    <path d="M132 85 C138 98 136 116 125 128 C127 124 126 118 122 114 C127 110 130 102 128 95 C125 97 122 96 120 93 C124 89 126 81 123 75 C120 80 117 80 115 78 C120 73 117 67 114 63 C113 68 109 69 107 67 C111 61 112 53 109 49 C120 58 129 70 132 85 Z" opacity="0.9"/>
    <!-- Roman Numeral I -->
    <text x="100" y="118" font-family="'Cinzel', serif" font-size="34" font-weight="800" text-anchor="middle" fill="url(#goldGrad1)">I</text>
    <!-- Bottom Flourish Ribbon -->
    <path d="M82 135 C92 138 108 138 118 135 C113 140 105 142 100 142 C95 142 87 140 82 135 Z" fill="url(#goldGrad1)"/>
  </g>
</svg>
