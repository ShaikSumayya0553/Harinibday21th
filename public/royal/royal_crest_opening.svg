<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <radialGradient id="openingWax" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#9E223D"/>
      <stop offset="55%" stop-color="#640D1E"/>
      <stop offset="100%" stop-color="#34030D"/>
    </radialGradient>
    <linearGradient id="goldOpening" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="30%" stop-color="#E5C16C"/>
      <stop offset="65%" stop-color="#B88A2B"/>
      <stop offset="100%" stop-color="#735215"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#781427"/>
      <stop offset="50%" stop-color="#4E0816"/>
      <stop offset="100%" stop-color="#2D0209"/>
    </linearGradient>
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Velvet Burgundy Ribbons Hanging Down -->
  <g filter="url(#royalShadow)">
    <path d="M96 140 L70 245 L95 230 L115 245 L108 140 Z" fill="url(#ribbonGrad)"/>
    <path d="M144 140 L125 245 L145 230 L170 245 L132 140 Z" fill="url(#ribbonGrad)"/>
    <!-- Gold Ribbon Fringe Lines -->
    <path d="M70 245 L95 230 L115 245" stroke="url(#goldOpening)" stroke-width="2" fill="none"/>
    <path d="M125 245 L145 230 L170 245" stroke="url(#goldOpening)" stroke-width="2" fill="none"/>
  </g>

  <!-- Large Central Royal Wax Seal Medallion -->
  <g filter="url(#royalShadow)">
    <!-- Dripped Wax Rim -->
    <path d="M120 15 C150 12 180 26 200 48 C220 70 230 100 228 128 C226 156 210 184 186 204 C162 222 130 230 102 226 C74 222 46 206 28 182 C10 158 6 128 10 98 C14 68 34 40 60 24 C82 12 98 16 120 15 Z" fill="url(#openingWax)"/>
    <!-- Concentric Golden Circles -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#2B030A" stroke-width="5" opacity="0.7"/>
    <circle cx="120" cy="120" r="80" fill="url(#openingWax)"/>
    <circle cx="120" cy="120" r="76" fill="none" stroke="url(#goldOpening)" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="120" cy="120" r="72" fill="none" stroke="url(#goldOpening)" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Imperial Crown at the Top of Wax -->
  <g fill="url(#goldOpening)">
    <path d="M98 68 L106 82 L120 60 L134 82 L142 68 L138 88 L102 88 Z"/>
    <circle cx="98" cy="65" r="3"/>
    <circle cx="120" cy="57" r="3.5"/>
    <circle cx="142" cy="65" r="3"/>
    <!-- Crown Base Pearls -->
    <line x1="102" y1="91" x2="138" y2="91" stroke="url(#goldOpening)" stroke-width="2"/>
    <circle cx="106" cy="91" r="1.5" fill="#FFF"/>
    <circle cx="113" cy="91" r="1.5" fill="#FFF"/>
    <circle cx="120" cy="91" r="1.5" fill="#FFF"/>
    <circle cx="127" cy="91" r="1.5" fill="#FFF"/>
    <circle cx="134" cy="91" r="1.5" fill="#FFF"/>
  </g>

  <!-- Large Roman "21" and Imperial Laurels -->
  <g fill="url(#goldOpening)">
    <!-- Laurel Wreath Left -->
    <path d="M78 100 C72 120 76 144 92 160 C88 152 90 144 96 138 C88 132 86 120 90 110 C94 114 98 114 100 110 C94 104 98 94 102 88 C94 92 84 92 78 100 Z" opacity="0.9"/>
    <!-- Laurel Wreath Right -->
    <path d="M162 100 C168 120 164 144 148 160 C152 152 150 144 144 138 C152 132 154 120 150 110 C146 114 142 114 140 110 C146 104 142 94 138 88 C146 92 156 92 162 100 Z" opacity="0.9"/>
    <!-- Center 21 Text in Royal Roman Typography -->
    <text x="120" y="148" font-family="'Cinzel', 'Playfair Display', serif" font-size="52" font-weight="900" text-anchor="middle" fill="url(#goldOpening)" letter-spacing="1">21</text>
    <text x="120" y="168" font-family="'Cinzel', serif" font-size="12" font-weight="700" text-anchor="middle" fill="url(#goldOpening)" letter-spacing="4">YEARS</text>
  </g>
</svg>
